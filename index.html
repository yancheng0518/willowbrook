<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171e1a">
  <meta name="description" content="在可交互的三维森林里环游溪畔小屋、木亭和菜园，亲手点亮屋灯与桌上油灯。">
  <title>溪畔小屋 · Willowbrook</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}
  </script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-cabin" viewBox="0 0 24 24"><path d="M2.5 12 12 4l9.5 8M5 10v10h14V10M10 20v-6h4v6M16.5 7.5V4H19v5.5"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.7"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-34 12 12)"/><path d="M12 9.5v5m-2.5-2.5h5"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 9h5V4m6 0v5h5M4 15h5v5m11-5h-5v5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 15.2A9 9 0 0 1 8.8 3.3a9 9 0 1 0 11.9 11.9Z"/></symbol>
    <symbol id="i-lantern" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 6 0M7 7h10l2 12H5L7 7Zm2 0V5h6v2M4 21h16M12 16c-2 0-2-2.1 0-4.2 2 2.1 2 4.2 0 4.2Z"/></symbol>
    <symbol id="i-pavilion" viewBox="0 0 24 24"><path d="M2 11 12 5l10 6H2Zm3 0v8m14-8v8M3 20h18M5 14l3-3m11 3-3-3"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M2 8c3 0 3-2 5-2s3 2 5 2 3-2 5-2 2 2 5 2M2 13c3 0 3-2 5-2s3 2 5 2 3-2 5-2 2 2 5 2M2 18c3 0 3-2 5-2s3 2 5 2 3-2 5-2 2 2 5 2"/></symbol>
    <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.1 7.2M4 4v6h6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.1a2.7 2.7 0 1 1 4.1 2.3c-.9.6-1.5 1.2-1.5 2.2m0 3.3v.1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-mark" viewBox="0 0 36 36"><path d="m4 18 11-9 10 9m-18-2.2V26h16v-9.5M12 26v-6h5v6m10-14 4-7 4 7h-2.4l2.4 4h-8l2.4-4H27Zm4 4v7m-3 4c2-1 4-1 6 0M3 30h20m5 0h5"/></symbol>
  </svg>
  <div class="experience" id="experience">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 36 36"><use href="#i-mark"/></svg></span>
        <span>林间漫游<small lang="en">WOODLAND EXPLORER</small></span>
      </div>
      <div class="header-actions">
        <button class="text-button" type="button" id="open-guide">
          <svg class="icon"><use href="#i-help"/></svg><span>操作指南</span>
        </button>
        <span class="header-rule" aria-hidden="true"></span>
        <button class="icon-button" type="button" id="fullscreen" aria-label="进入全屏" title="进入全屏">
          <svg class="icon"><use href="#i-expand"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <canvas id="world" tabindex="0" aria-label="森林小屋三维视图" aria-describedby="canvas-guide"></canvas>
      <p class="sr-only" id="canvas-guide">拖动画面旋转，滚轮或双指缩放。键盘可用方向键旋转，加减号缩放，Home 键复位。</p>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scene-title">
        <p><span></span>溪畔小屋</p>
        <h1 lang="en">Willowbrook</h1>
      </div>

      <div class="scene-status" id="scene-status" role="status">
        <span class="spinner" aria-hidden="true"></span><span id="status-text">正在构建森林场景</span>
        <button class="text-button retry" id="retry" type="button" hidden>重新载入</button>
      </div>

      <aside class="lighting" aria-labelledby="lighting-heading" inert>
        <div class="lighting-heading">
          <svg class="icon"><use href="#i-sun"/></svg>
          <h2 id="lighting-heading">场景照明</h2>
        </div>
        <div class="time" role="group" aria-label="环境时段">
          <button type="button" data-time="dusk" aria-pressed="true"><svg class="icon"><use href="#i-sun"/></svg>黄昏</button>
          <button type="button" data-time="night" aria-pressed="false"><svg class="icon"><use href="#i-moon"/></svg>入夜</button>
        </div>
        <div class="light-switches">
          <button class="light-switch" type="button" data-light="house" role="switch" aria-checked="true">
            <svg class="icon"><use href="#i-cabin"/></svg><span>房屋灯光</span><i aria-hidden="true"></i>
          </button>
          <button class="light-switch" type="button" data-light="table" role="switch" aria-checked="true">
            <svg class="icon"><use href="#i-lantern"/></svg><span>桌上油灯</span><i aria-hidden="true"></i>
          </button>
        </div>
      </aside>

      <div class="gesture-hint" aria-hidden="true">
        <svg class="icon"><use href="#i-mouse"/></svg><span class="desktop-hint">拖动旋转<span class="hint-dot"></span>滚轮缩放</span>
        <span class="touch-hint">单指旋转<span class="hint-dot"></span>双指缩放</span>
      </div>
    </main>

    <footer class="viewbar">
      <nav class="views" aria-label="观察视角" inert>
        <span class="views-label">视角</span>
        <button type="button" data-view="overview" aria-pressed="true"><svg class="icon"><use href="#i-orbit"/></svg>全景</button>
        <button type="button" data-view="cottage" aria-pressed="false"><svg class="icon"><use href="#i-cabin"/></svg>小屋</button>
        <button type="button" data-view="pavilion" aria-pressed="false"><svg class="icon"><use href="#i-pavilion"/></svg>木亭</button>
        <button type="button" data-view="creek" aria-pressed="false"><svg class="icon"><use href="#i-water"/></svg>溪流</button>
      </nav>
      <button class="text-button reset" id="reset" type="button" disabled>
        <svg class="icon"><use href="#i-reset"/></svg><span>复位</span>
      </button>
    </footer>

    <dialog id="guide" aria-labelledby="guide-heading">
      <div class="guide-title">
        <h2 id="guide-heading">操作指南</h2>
        <form method="dialog"><button type="submit" class="icon-button" aria-label="关闭指南"><svg class="icon"><use href="#i-close"/></svg></button></form>
      </div>
      <dl class="guide-controls">
        <div><dt>旋转</dt><dd>鼠标拖动 · 单指拖动 · 方向键</dd></div>
        <div><dt>缩放</dt><dd>鼠标滚轮 · 双指捏合 · 加减号</dd></div>
        <div><dt>复位</dt><dd>底栏复位按钮 · Home 键</dd></div>
      </dl>
      <p>先将焦点移到三维视图，即可用键盘操作镜头。</p>
    </dialog>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
